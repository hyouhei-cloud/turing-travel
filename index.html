<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅のプランナー</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#1d2433;--sub:#6b7385;--line:#e6e8ee;--bg:#f4f5f8;--accent:#0b7a75;--accent2:#e8a33d;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding-bottom:40px}
header.top{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.02em;color:var(--accent);font-size:17px}
.logo small{color:var(--sub);font-weight:600;font-size:11px;margin-left:6px}
.saved{margin-left:auto;font-size:11px;color:var(--sub)}
.search{margin:12px 16px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.search .row{display:flex;align-items:center;gap:10px;font-size:14px}
.search .lab{width:44px;font-size:11px;color:var(--sub)}
.search input{flex:1;border:none;font-size:15px;font-weight:600;color:var(--ink);background:transparent;padding:0;font-family:inherit}
.search .div{height:1px;background:var(--line)}
.hero{margin:12px 16px 0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.map{display:block;width:100%;height:auto;background:#cfe6f3}
.heroBody{padding:14px 16px 16px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:#e3f3f2;border-radius:6px;padding:3px 7px}
h1{font-size:22px;margin:8px 0 2px;line-height:1.3}
.place{font-size:13px;color:var(--sub)}
.meta{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.meta b{display:block;font-size:15px;color:var(--ink)}
.total{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:flex-end;justify-content:space-between}
.total .k{font-size:12px;color:var(--sub)}
.total .v{font-size:26px;font-weight:800;color:var(--ink)}
.total .v small{font-size:13px;font-weight:600}
section{margin:14px 16px 0;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h2{font-size:15px;margin:0 0 10px}
.leg{display:flex;gap:12px;position:relative;padding-bottom:14px}
.leg:last-child{padding-bottom:0}
.leg .ic{flex:none;width:30px;height:30px;border-radius:50%;background:#e3f3f2;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1}
.leg:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;border-left:2px dotted #b9c7cc}
.leg .bd{flex:1;min-width:0}
.leg .t{font-weight:700;font-size:14px}
.leg .d{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
.leg .p{font-size:13px;font-weight:700;white-space:nowrap}
.hotel{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.hotel:first-of-type{border-top:none;padding-top:0}
.hotel .ph{flex:none;width:64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px}
.hotel .nm{font-weight:700;font-size:14px}
.hotel .st{color:var(--accent2);font-size:12px;letter-spacing:1px}
.hotel .d{font-size:12px;color:var(--sub);line-height:1.5}
.hotel .p{margin-left:auto;text-align:right;font-weight:700;font-size:13px;white-space:nowrap}
.hotel .p small{display:block;font-weight:500;color:var(--sub);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:600;white-space:nowrap}
tr.sum td{border-bottom:none;font-weight:800;font-size:15px;padding-top:10px}
.day{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:none}
.day b{flex:none;width:52px;color:var(--accent)}
.note{font-size:11px;color:var(--sub);margin:12px 18px 0;line-height:1.6}
/* 写真と紹介文 */
.ph-box{position:relative;overflow:hidden;background-size:cover;background-position:center}
.ph-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph-box img.on{opacity:1}
.ph-box .lbl{position:absolute;left:10px;top:10px;font-size:10px;color:#fff;background:rgba(0,0,0,.28);border-radius:4px;padding:2px 6px}
.heroPh{aspect-ratio:4/3}
.heroPh .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62))}
.heroPh .catch{position:absolute;left:16px;right:16px;bottom:14px;color:#fff;font-size:19px;font-weight:800;line-height:1.45;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.heroPh .cnt{position:absolute;right:10px;top:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.4);border-radius:10px;padding:2px 8px}
.intro{font-size:13.5px;line-height:1.85;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tags span{font-size:11px;font-weight:700;color:var(--accent);background:#e3f3f2;border-radius:20px;padding:4px 10px}
.spot{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.spot .ph-box{aspect-ratio:16/9}
.spot .no{position:absolute;left:10px;bottom:8px;color:#fff;font-size:11px;font-weight:700;background:var(--accent);border-radius:4px;padding:2px 7px}
.spot .bd{padding:10px 12px 12px}
.spot .nm{font-weight:800;font-size:14.5px}
.spot .d{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:4px}
.mapBox{margin:-2px -4px 12px;border-radius:12px;overflow:hidden}
.day{align-items:center}
.day .th{flex:none;width:54px;height:40px;border-radius:6px;margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo">TABIPLAN<small>旅のプランナー</small></div><div class="saved" id="saved"></div></header>

  <div class="search">
    <div class="row"><span class="lab">出発地</span><input id="inFrom" readonly></div>
    <div class="div"></div>
    <div class="row"><span class="lab">目的地</span><input id="inTo" readonly></div>
  </div>

  <div class="hero">
    <div class="ph-box heroPh" id="heroPh"><span class="lbl" id="heroLbl"></span><img id="heroImg" alt=""><div class="shade"></div><div class="cnt" id="heroCnt"></div><div class="catch" id="catch"></div></div>
    <div class="heroBody">
      <span class="badge" id="badge">世界遺産</span>
      <h1 id="title"></h1>
      <div class="place" id="place"></div>
      <div class="meta">
        <div>日程<b id="mDays"></b></div>
        <div>出発日<b id="mDate"></b></div>
        <div>移動時間<b id="mTime"></b></div>
        <div>人数<b>大人1名</b></div>
      </div>
      <div class="total"><div class="k">旅行代金の目安（1名）</div><div class="v" id="total"></div></div>
    </div>
  </div>

  <section id="about"><h2>このツアーのみどころ</h2><p class="intro" id="intro"></p><div class="tags" id="tags"></div><div id="spots"></div></section>
  <section><h2>交通ルート</h2><div class="mapBox"><svg class="map" id="map" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid slice"></svg></div><div id="legs"></div></section>
  <section><h2>宿泊プラン</h2><div id="hotels"></div></section>
  <section><h2>日程</h2><div id="days"></div></section>
  <section><h2>費用の内訳（1名）</h2><table id="cost"></table></section>
  <p class="note" id="note">※料金は時期・空席状況により変わる目安です。為替は1ドル＝150円、1ユーロ＝165円、1ポンド＝190円、1豪ドル＝100円で計算しています。燃油サーチャージ・空港使用料を含みます。</p>

</div>

const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const $ = id => document.getElementById(id);
const P = (lon,lat) => [(lon+180)/360*1000, (90-lat)/180*500];

function parseHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/,"")).toLowerCase();
  const [s,o] = h.split("-");
  return { site: SITES[s] ? s : "mp", origin: ORIGINS[o] ? o : "hnd" };
}

function drawMap(site, origin){
  let [ox,oy] = P(origin.lon, origin.lat), [dx,dy] = P(site.lon, site.lat);
  if (dx - ox < -500) dx += 1000;           // 太平洋まわりにする
  if (dx - ox > 500) dx -= 1000;
  const minX = Math.min(ox,dx), maxX = Math.max(ox,dx), minY = Math.min(oy,dy), maxY = Math.max(oy,dy);
  // 国内は日本のまわりだけ大きく見せる
  let w = Math.max(maxX-minX, site.domestic ? 30 : 120)*1.5, h = w*0.42;
  if ((maxY-minY)*1.6 > h){ h = (maxY-minY)*1.6; w = h/0.42; }
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2 - h*0.04;
  const vb = [cx-w/2, cy-h/2, w, h];
  const k = w/380;                        // 線の太さを地図の大きさに合わせる
  const mx = (ox+dx)/2, my = (oy+dy)/2 - Math.abs(dx-ox)*0.22 - 10*k;
  const land = [-1000,0,1000].map(t=>`<path d="${LAND}" transform="translate(${t},0)" fill="#f7f4ec" stroke="#c9d6dc" stroke-width="${0.6*k}"/>`).join("");
  $("map").setAttribute("viewBox", vb.join(" "));
  $("map").innerHTML = `
    <rect x="${vb[0]}" y="${vb[1]}" width="${w}" height="${h}" fill="#cfe6f3"/>${land}
    <path d="M${ox},${oy} Q${mx},${my} ${dx},${dy}" fill="none" stroke="#0b7a75" stroke-width="${2.2*k}" stroke-dasharray="${6*k} ${4*k}" stroke-linecap="round"/>
    <circle cx="${ox}" cy="${oy}" r="${5*k}" fill="#fff" stroke="#0b7a75" stroke-width="${2.5*k}"/>
    <circle cx="${dx}" cy="${dy}" r="${6*k}" fill="#e8a33d" stroke="#fff" stroke-width="${2.5*k}"/>
    <text x="${ox}" y="${oy+18*k}" font-size="${13*k}" text-anchor="middle" fill="#1d2433" font-weight="700">${origin.city}</text>
    <text x="${dx}" y="${dy-12*k}" font-size="${14*k}" text-anchor="middle" fill="#1d2433" font-weight="800">${site.name}</text>`;
}

// 写真を読み込む。読めたら表示し、仮の文字ラベルを消す。読めなければ色の枠のまま
function setPhoto(box, img, src, bg, lbl, lblText){
  if (bg) box.style.background = bg;
  if (lbl && lblText) lbl.textContent = lblText;
  if (lbl) lbl.style.display = "";
  img.classList.remove("on");
  img.onload = () => { img.classList.add("on"); if (lbl) lbl.style.display = "none"; };
  img.onerror = () => { img.removeAttribute("src"); };
  if (src) img.src = src; else img.removeAttribute("src");
}

const NOTE_INTL = document.getElementById("note").textContent;   // 海外用の注意書き（最初の文のまま）

function render(){
  const {site:sk, origin:okey} = parseHash();
  const s = SITES[sk], o = ORIGINS[okey];
  const tokyo = (okey==="hnd"||okey==="nrt");

  $("inFrom").value = o.city + "（現在地）";
  $("inTo").value = s.name;
  $("title").textContent = `${s.name}への旅 ${s.nights}泊${s.days}日`;
  $("place").textContent = `${s.country}｜${s.full}`;
  $("badge").textContent = "世界遺産";
  drawMap(s, o);

  // 写真と紹介文（写真が無い・読めないときは色の枠のまま）
  const hero = s.hero || {bg:"linear-gradient(135deg,#9fb7c9,#5b7a92)"};
  setPhoto($("heroPh"), $("heroImg"), hero.src, hero.bg, $("heroLbl"), "写真：" + (hero.alt || s.name));
  $("catch").innerHTML = s.catch || `${s.name}をめぐる${s.nights}泊${s.days}日`;
  $("heroCnt").textContent = s.spots ? `写真 1/${s.spots.length + 1}` : "";
  $("about").style.display = s.intro ? "" : "none";
  $("intro").textContent = s.intro || "";
  $("tags").innerHTML = (s.tags||[]).map(t=>`<span>${t}</span>`).join("");
  $("spots").innerHTML = (s.spots||[]).map((p,i)=>`<div class="spot"><div class="ph-box" data-src="${p.src||""}" style="background:${p.bg}"><span class="lbl">写真：${p.nm}</span><img alt="${p.nm}"><span class="no">みどころ ${i+1}</span></div><div class="bd"><div class="nm">${p.nm}</div><div class="d">${p.d}</div></div></div>`).join("");
  $("spots").querySelectorAll(".ph-box").forEach(b=>setPhoto(b, b.querySelector("img"), b.dataset.src, null, b.querySelector(".lbl")));

  // 出発日：今日から約2か月後の土曜日
  const dep = new Date(); dep.setDate(dep.getDate()+60); dep.setDate(dep.getDate() + ((6-dep.getDay()+7)%7));
  const ret = new Date(dep); ret.setDate(ret.getDate()+s.days-1);
  const f = d => `${d.getMonth()+1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`;
  $("mDate").textContent = f(dep);
  $("mDays").textContent = `${s.nights}泊${s.days}日`;
  const now = new Date();
  $("saved").textContent = `保存済み ${now.getMonth()+1}/${now.getDate()}`;

  // 交通
  const dom = !!s.domestic;   // 国内（厳島神社）：出発地ごとの行き方に置き換え、乗継・燃油の話は出さない
  const legs = dom ? [...s.dom[okey], ...s.legs.filter(l=>!l.first)] : s.legs;
  let rows = [], legHtml = "", hrs = 0;
  legs.forEach(L=>{
    let t = L.t.replace("{O}", o.name.replace(/（.*）/,"")), d = L.d, p = L.p, h = L.h;
    if (L.first){
      t = L.t.replace("{O}", o.name);
      if (!tokyo && !dom){ d = `${s.hub}乗継（往復）／約${Math.round(L.h + o.hrs)}時間`; p += o.add; h += o.hrs; }
      rows.push([L.lbl || "航空券（往復・エコノミー）", p]);
    } else rows.push([L.t, p]);
    hrs += h;
    legHtml += `<div class="leg"><div class="ic">${L.m}</div><div class="bd"><div class="t">${t}</div><div class="d">${d}</div></div><div class="p">${p?yen(p):"無料"}</div></div>`;
  });
  $("legs").innerHTML = legHtml;
  $("mTime").textContent = dom ? `片道 約${Math.round(legs.reduce((a,l)=>a+l.h,0))}時間`
                               : `片道 約${Math.round(s.legs.filter(l=>l.first)[0].h + (tokyo?0:o.hrs) + 3)}時間`;

  // 宿
  let hotelSum = 0;
  $("hotels").innerHTML = s.hotels.map(H=>{
    hotelSum += H.p*H.n;
    return `<div class="hotel"><div class="ph" style="background:${H.bg}">${H.ph}</div><div><div class="nm">${H.nm}</div><div class="st">${"★".repeat(H.st)}${"☆".repeat(5-H.st)}</div><div class="d">${H.d}・${H.n}泊</div></div><div class="p">${yen(H.p)}<small>${dom?"1泊2食付":"1泊・朝食付"}</small></div></div>`;
  }).join("");

  // 日程
  const dp = s.dayPhotos || {};
  $("days").innerHTML = s.plan.map((t,i)=>`<div class="day"><b>${i+1}日目</b><span>${t.replace("東京", tokyo?"東京":o.name.replace(/（.*）/,""))}</span>${dp[i+1]?`<div class="ph-box th" data-src="${dp[i+1]}" style="background:${hero.bg}"><img alt=""></div>`:""}</div>`).join("");
  $("days").querySelectorAll(".ph-box").forEach(b=>setPhoto(b, b.querySelector("img"), b.dataset.src));

  // 内訳
  const ground = rows.slice(1).reduce((a,r)=>a+r[1],0);
  const fees = s.fees.reduce((a,r)=>a+r[1],0);
  const total = rows[0][1] + ground + hotelSum + fees;
  const cost = [
    [rows[0][0], rows[0][1]],
    ["現地の交通", ground],
    [`宿泊（${s.nights}泊・${dom?"2食付":"朝食付"}）`, hotelSum],
    ...s.fees,
  ];
  $("cost").innerHTML = cost.map(r=>`<tr><td>${r[0]}</td><td>${yen(r[1])}</td></tr>`).join("") + `<tr class="sum"><td>合計</td><td>${yen(total)}</td></tr>`;
  $("total").innerHTML = `${yen(total)}<small>〜</small>`;
  $("note").textContent = dom
    ? `※料金は時期・空席状況により変わる目安です。${rows[0][0].startsWith("新幹線")?"新幹線は普通車指定席、":"航空券は空港使用料を含み、"}宿は夕食・朝食付きの料金です。`
    : NOTE_INTL;

}


window.addEventListener("hashchange", render);
render();
</script>
